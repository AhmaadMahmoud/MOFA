name: Deploy to Hostinger

# Every push to main builds the site into one zip and sends it over HTTPS, in 4 MB pieces, to
# public_html/_deploy.php (the same port the site uses, so no FTP to get blocked). The hook checks
# the zip's checksum, unpacks it over mofa/ and public_html/, runs migrations and rebuilds the caches.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://mofasando.store' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, gd, zip, bcmath, mbstring, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Composer install (no dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble and zip mofa/ + public_html/
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "DEPLOY_KEY secret is missing"; exit 1; }
          export DEPLOY_KEY_HASH="$(printf %s "$DEPLOY_KEY" | sha256sum | cut -d' ' -f1)"
          bash deploy/assemble.sh "$RUNNER_TEMP/out"
          (cd "$RUNNER_TEMP/out" && zip -qry "$RUNNER_TEMP/mofa-release.zip" mofa public_html)
          ls -lh "$RUNNER_TEMP/mofa-release.zip"

      - name: Upload and deploy over HTTPS
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/mofa-release.zip"
          sum="$(sha256sum "$zip" | cut -d' ' -f1)"
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 4194304 -d -a 3 "$zip" "$RUNNER_TEMP/parts/p"
          i=0
          for part in "$RUNNER_TEMP"/parts/p*; do
            curl -fsS --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
                 -X POST -H "X-Deploy-Key: $DEPLOY_KEY" -H "Content-Type: application/octet-stream" \
                 --data-binary @"$part" "$SITE_URL/_deploy.php?action=upload&part=$i&offset=$((i * 4194304))"
            i=$((i + 1))
          done
          curl -fsS --max-time 600 -X POST -H "X-Deploy-Key: $DEPLOY_KEY" \
               "$SITE_URL/_deploy.php?action=deploy&sha256=$sum"
